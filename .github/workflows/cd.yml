name: CD

on: workflow_dispatch

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION_STABLE: 1.51.0
  CRATE_PATHS: .

jobs:
  check-version:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.retrieve-version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v2
      - name: Check CHANGELOG.md file exists
        run: "[ -f CHANGELOG.md ]"
      # - name: Check unreleased version is defined in CHANGELOG.md
      #   run: grep '^\#\# \[Unreleased\] - yyyy-mm-dd$' CHANGELOG.md
      - name: Check and retrieve version
        id: retrieve-version
        run: bash .github/workflows/scripts/get_version.sh

  test-ubuntu:
    runs-on: ubuntu-22.04
    needs: check-version
    steps:
      - name: Checkout
        uses: actions/checkout@v2
      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION_STABLE }}
          profile: minimal
          override: true
      - name: Build
        run: cargo build --release
      - name: Test
        run: cargo test

  test-windows:
    runs-on: windows-2019
    needs: check-version
    steps:
      - name: Checkout
        uses: actions/checkout@v2
      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION_STABLE }}
          profile: minimal
          override: true
      - name: Build
        run: cargo build --release
      - name: Test
        run: cargo test

  test-macos:
    runs-on: macos-10.15
    needs: check-version
    steps:
      - name: Checkout
        uses: actions/checkout@v2
      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION_STABLE }}
          profile: minimal
          override: true
      - name: Build
        run: cargo build --release
      - name: Test
        run: cargo test

  # check-publication:
  #   runs-on: ubuntu-22.04
  #   needs: check-version
  #   steps:
  #     - name: Checkout
  #       uses: actions/checkout@v2
  #     - name: Install Rust toolchain
  #       uses: actions-rs/toolchain@v1
  #       with:
  #         toolchain: ${{ env.RUST_VERSION_STABLE }}
  #         profile: minimal
  #         override: true
  #     - name: Check publication
  #       run: bash .github/workflows/scripts/check_publication.sh
  #       env:
  #         CRATES_IO_TOKEN: ${{ secrets.CRATES_TOKEN }}

  publish:
    runs-on: ubuntu-22.04
    needs:
      - test-ubuntu
      - test-windows
      - test-macos
      # - check-publication
    steps:
      - name: Checkout
        uses: actions/checkout@v2
      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION_STABLE }}
          profile: minimal
          override: true
      - name: Publish
        run: bash .github/workflows/scripts/run_publication.sh
        env:
          CRATES_IO_TOKEN: ${{ secrets.CRATES_TOKEN }}

  