[package]
name = "bevy-codex"
version = "0.6.2"
description = "A manager for menus and huds with the bevy game engine"
repository = "https://github.com/KyleWinston/bevy-codex"
license = "MIT OR Apache-2.0"
edition = "2021"
publish = true
keywords = ["bevy", "menus", "ui"]
exclude = ["assets/**/*", "tools/**/*", "examples/**/*", ".github/**/*"]


[dependencies]
serde = { version = "1.0.99", features = ["derive"] }
bevy = { version = "0.16.0", default-features = false, features = [
    "bevy_asset",
    "bevy_state",
    "bevy_text",
    "bevy_window",
    "png",
] }
bevy_hui = "0.4.0"
# bevy_yarnspinner = "0.5.0-rc.1"
bevy_yarnspinner = { git = "https://github.com/YarnSpinnerTool/YarnSpinner-Rust", branch = "main" }
unicode-segmentation = "1.12.0"
bevy_hui_widgets = "0.3.0"
bevy_common_assets = { version = "0.13.0", default-features = false, features = [
    "ron",
] }
bevy_simple_text_input = "0.11.0"
lightningcss = "1.0.0-alpha.65"

[dev-dependencies]
bevy = { version = "0.16.0", default-features = false, features = [
    "bevy_render",
    "file_watcher",
    "multi_threaded",
    "default_font",
    "tonemapping_luts",
] }


[target.'cfg(target_os = "linux")'.dev-dependencies.bevy]
features = ["x11", "wayland", "bevy_winit"]
version = "0.16.0"
default-features = false


# Enable a small amount of optimization in debug mode
[profile.dev]
opt-level = 1

# Enable high optimizations for dependencies (incl. Bevy), but not for our code:
[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
strip = true
lto = true

[package.metadata.android.sdk]
target_sdk_version = 34
min_sdk_version = 33
